[pytest]
# Keep default exclusions, plus build trees and local-only development
# checks (tests/local, benchmarks/local are git-ignored on purpose).
norecursedirs =
    .*
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    venv
    .zig-cache
    zig-out
    node_modules
    tests/local
    benchmarks/local
