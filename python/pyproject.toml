[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zig-constraints"
version = "0.1.0"
description = "Адаптивный движок структурированной генерации LLM (ядро Zig, C ABI, Python-мост)"
readme = { text = "Structured generation engine: Zig core + CPython abi3 bridge.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.optional-dependencies]
transformers = ["torch>=2.1,<3", "transformers>=4.40,<6"]
numpy = ["numpy>=1.23"]

[tool.setuptools]
packages = ["zig_constraints"]
include-package-data = true

[tool.setuptools.package-data]
zig_constraints = ["py.typed", "_lib/libzig_constraints.so*"]

[tool.distutils.bdist_wheel]
py_limited_api = "cp310"
