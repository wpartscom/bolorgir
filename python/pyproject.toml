[build-system]
# setuptools>=77 understands the SPDX license string and license-files.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolorgir"
version = "0.2.0rc1"
description = "Embeddable structured-generation engine for LLMs: Zig core, C ABI, Python bindings"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bolorgir contributors" }]
keywords = ["llm", "structured-generation", "constrained-decoding", "json-schema", "zig"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/wpartscom/bolorgir"
Repository = "https://github.com/wpartscom/bolorgir"
Issues = "https://github.com/wpartscom/bolorgir/issues"
Changelog = "https://github.com/wpartscom/bolorgir/blob/main/CHANGELOG.md"

[project.optional-dependencies]
transformers = ["torch>=2.2,<3", "transformers>=4.40,<6"]
numpy = ["numpy>=1.26"]
# Serving integration: the backend module implements the structured-output
# interface of vLLM 0.31.x and needs the pinned upstream patch for
# registration (integrations/vllm/, docs/integrations/vllm.md). Installing
# this extra does not register the backend by itself.
vllm = ["vllm>=0.31,<0.32"]
dev = ["pytest>=7", "numpy>=1.26", "jsonschema>=4", "transformers>=4.40,<6", "torch>=2.2,<3", "pillow>=10"]

[tool.setuptools]
packages = ["bolorgir"]
include-package-data = true

[tool.setuptools.package-data]
bolorgir = ["py.typed", "_lib/libbolorgir.so*", "_lib/libbolorgir*.dylib"]

[tool.distutils.bdist_wheel]
py_limited_api = "cp312"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F"]
