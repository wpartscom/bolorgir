name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:17 UTC
    - cron: "17 4 * * 1"

jobs:
  zig:
    name: Zig core (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Debug
            args: ""
          - mode: ReleaseSafe
            args: "-Drelease=true"
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Unit tests
        run: zig build test ${{ matrix.args }} --summary all

      - name: Build C example
        run: zig build example-c ${{ matrix.args }}

      - name: Run C example
        run: LD_LIBRARY_PATH=zig-out/lib zig-out/bin/c_client

  num-cert:
    name: Numeric certificate cross-check (test hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release library has no test hooks
        run: |
          zig build -Drelease=true
          if nm -D zig-out/lib/libbolorgir.so.0.1.0 | grep blg_test_; then echo "blg_test_* exported by the release library"; exit 1; fi

      - name: Build the core with test hooks
        run: zig build -Drelease=true -Dtest_hooks=true --prefix zig-out/test-hooks

      - name: Install tooling
        run: python3 -m pip install --upgrade pip pytest jsonschema

      - name: Certificate vs reference and bounded search (fast mode)
        run: BLG_LIB_PATH=zig-out/test-hooks/lib/libbolorgir.so.0.1.0 python3 tests/numconj_cert_check.py --jobs 4

  text-rules:
    name: Text rules (U+2014, Cyrillic in code)
    runs-on: ubuntu-latest
    env:
      # Byte patterns: in a UTF-8 locale git grep -P reads \xE2 as U+00E2.
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4

      - name: Patterns match their targets
        run: |
          printf 'a\xe2\x80\x94b\n' > probe-dash.txt
          printf 'x = "\xd0\xba"\n' > probe-cyr.py
          git grep --no-index -qP '\xE2\x80\x94' -- probe-dash.txt
          git grep --no-index -qP '[\xD0-\xD3][\x80-\xBF]' -- probe-cyr.py
          rm probe-dash.txt probe-cyr.py

      - name: No em-dash (U+2014) in tracked files
        # -I: compressed reports may hold these bytes by chance.
        run: |
          if git grep -nIP '\xE2\x80\x94'; then echo "U+2014 found"; exit 1; fi

      - name: No Cyrillic in code files
        # Unicode test payloads are exempt: these files carry Cyrillic bytes
        # on purpose (multibyte keys and non-ascii paths), and the frozen
        # core file keeps its reviewed content. Keep the list minimal.
        run: |
          if git grep -nP '[\xD0-\xD3][\x80-\xBF]' -- '*.zig' '*.h' '*.c' '*.py' \
              ':!src/complete.zig' ':!tests/completion_reference.py' \
              ':!tests/test_open_object_dead_ends.py' \
              ':!tests/test_r6_release_tools.py'; then echo "Cyrillic in code"; exit 1; fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The abi3 floor is 3.12: 3.10 reached EOL in October 2026 and was
        # dropped together with 3.11 (numpy 2.5 already requires >= 3.12).
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_release_manifest.py runs the isolated_tests.sh flag
          # block, whose guard needs BASELINE_REV (2523dd9) present in the
          # history; the default depth 1 checkout does not contain it.
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build core library (ReleaseSafe, portable CPU)
        # baseline CPU: the wheel must keep working on machines older than
        # the runner (no native -mcpu tuning).
        run: zig build -Drelease=true -Dcpu=baseline

      - name: Install build/test tooling
        # pip>=24 is required for PEP 621 metadata (pip 22 under build isolation
        # silently produced UNKNOWN-0.0.0 wheels).
        # regress: 2025.10.1 builds through PyO3 0.26, which rejects Python
        # 3.15; 2026.9.1 is the first release with a cp315 wheel.
        run: python3 -m pip install --upgrade "pip>=24" "setuptools>=77" wheel pytest numpy jsonschema "regress==${{ matrix.python-version == '3.15' && '2026.9.1' || '2025.10.1' }}" transformers

      - name: Build Python extension in place
        working-directory: python
        env:
          # Reuse the freshly built core library; setup.py copies it from
          # zig-out/lib into _lib (without that sync the skip flag leaves
          # a stale stub in _lib).
          BLG_SKIP_ZIG: "1"
        run: python3 setup.py build_ext --inplace

      - name: Verify _lib matches zig-out
        run: cmp python/bolorgir/_lib/libbolorgir.so.0.1.0 zig-out/lib/libbolorgir.so.0.1.0

      - name: Strict compile of the bindings (limited API, GCC 14 diagnostics)
        # Py_LIMITED_API >= 0x030B0000 turns Py_INCREF/Py_XDECREF/Py_TYPE into
        # functions without the implicit cast of the old macros; compile the
        # file the way GCC 14 (manylinux_2_28) does, where
        # -Wincompatible-pointer-types is an error by default.
        if: matrix.python-version == '3.12'
        run: |
          inc="$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["include"])')"
          gcc -c python/bolorgir/_core.c -o /tmp/_core.strict.o \
            -Wall -fPIC -DPy_LIMITED_API=0x030C0000 \
            -Werror=incompatible-pointer-types \
            -Ipython/bolorgir/include -I"$inc"

      - name: pytest (ctypes backend)
        run: PYTHONPATH=python BLG_TEST_BACKEND=ctypes python3 -m pytest tests/ python/tests/ -q

      - name: pytest (package backend)
        run: PYTHONPATH=python BLG_TEST_BACKEND=package python3 -m pytest tests/ python/tests/ -q

      - name: Build wheel
        working-directory: python
        env:
          BLG_SKIP_ZIG: "1"
        run: python3 -m pip wheel . --no-deps -w dist

      - name: Smoke-install wheel in clean venv without torch
        run: |
          python3 -m venv /tmp/bolorgir-smoke-venv
          /tmp/bolorgir-smoke-venv/bin/pip install --no-index --find-links=python/dist bolorgir
          /tmp/bolorgir-smoke-venv/bin/python - <<'EOF'
          from bolorgir import Engine, TokenizerBundle

          tokens = [bytes([i]) for i in range(256)] + [b"\x00", b""]
          bundle = TokenizerBundle.from_token_bytes(
              tokens, eos_ids=[256], special_ids=[257])
          with Engine(mode="lazy") as engine:
              # Constraints must be closed before the Engine: the native
              # context refuses to die with live grammars.
              with engine.compile_literals(["yes", "no"], tokenizer=bundle) as constraint:
                  with constraint.create_session() as session:
                      ids = session.allowed_token_ids()
                      assert ids, "empty initial mask"
                      session.accept_token(ids[0])
          print("wheel smoke OK")
          EOF

  clean-build:
    # Build from a clean git archive (without ignored artifacts zig-out/ and
    # _lib/*.so). Both paths are exercised: BLG_SKIP_ZIG with a copy of the
    # fresh library and a full build_ext that builds the core itself.
    name: Clean build (git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        # Direct setup.py calls below do not resolve [build-system] requires;
        # setuptools/wheel must be present before the first setup.py run.
        run: python3 -m pip install --upgrade "pip>=24" "setuptools>=77" wheel

      - name: Print tool versions
        run: |
          python3 --version
          python3 -m pip --version
          python3 -m pip show setuptools wheel
          zig version

      - name: Export pristine tree
        run: |
          mkdir -p "$RUNNER_TEMP/clean"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/clean"

      - name: "Sanity: no prebuilt artifacts in the archive"
        run: |
          test ! -e "$RUNNER_TEMP/clean/zig-out"
          test ! -e "$RUNNER_TEMP/clean/python/bolorgir/_lib/libbolorgir.so.0.1.0"

      - name: Build core (baseline)
        working-directory: ${{ runner.temp }}/clean
        run: zig build -Drelease=true -Dcpu=baseline

      - name: BLG_SKIP_ZIG copies the fresh library (the former failure case)
        working-directory: ${{ runner.temp }}/clean/python
        env:
          BLG_SKIP_ZIG: "1"
        run: |
          python3 setup.py build_ext --inplace
          cmp bolorgir/_lib/libbolorgir.so.0.1.0 ../zig-out/lib/libbolorgir.so.0.1.0

      - name: Full build_ext with BLG_ZIG_ARGS (builds the core itself)
        # Separate fresh extraction: no zig-out/ or _lib artifacts from the
        # BLG_SKIP_ZIG pass above may leak into this build.
        run: |
          mkdir -p "$RUNNER_TEMP/clean-full"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/clean-full"
          cd "$RUNNER_TEMP/clean-full/python"
          BLG_ZIG_ARGS="-Dcpu=baseline" python3 setup.py build_ext --inplace
          ls bolorgir/_core.*.so
          cmp bolorgir/_lib/libbolorgir.so.0.1.0 ../zig-out/lib/libbolorgir.so.0.1.0

      - name: Wheel + smoke in a clean venv
        working-directory: ${{ runner.temp }}/clean/python
        env:
          BLG_SKIP_ZIG: "1"
        run: |
          python3 -m pip wheel . --no-deps -w dist
          DIST="$RUNNER_TEMP/clean/python/dist"
          VENV="$RUNNER_TEMP/bolorgir-clean-venv"
          SMOKE_DIR="$RUNNER_TEMP/bolorgir-smoke"
          mkdir -p "$SMOKE_DIR"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --upgrade "pip>=24"
          "$VENV/bin/pip" install --no-index --find-links="$DIST" bolorgir
          cd "$SMOKE_DIR"
          "$VENV/bin/python" -I - <<'EOF'
          import sys

          import bolorgir
          import bolorgir._core
          from bolorgir import Engine, TokenizerBundle

          for mod in (bolorgir, bolorgir._core):
              assert mod.__file__.startswith(sys.prefix), (
                  f"{mod.__name__} loaded from {mod.__file__}, "
                  f"outside venv {sys.prefix}")

          tokens = [bytes([i]) for i in range(256)] + [b"<eos>"]
          bundle = TokenizerBundle.from_token_bytes(tokens, eos_ids=[256])
          with Engine(mode="lazy", tokenizer=bundle) as engine:
              with engine.compile_literals(["ok"]) as constraint:
                  with constraint.create_session() as session:
                      assert session.allowed_token_ids()
          print("clean-build smoke OK")
          EOF

  sdist:
    name: sdist with the bundled core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build core (release flags) and the sdist
        env:
          BLG_SKIP_ZIG: "1"
        run: |
          zig build -Drelease=true -Dstrip=true -Dtarget=x86_64-linux-gnu.2.28 -Dcpu=baseline
          sha256sum zig-out/lib/libbolorgir.so.0.1.0   # the core of the release recipe
          python3 -m pip install --upgrade "pip>=24" build
          python3 -m build --sdist --outdir dist python
          tar -tzf dist/*.tar.gz | grep '_lib/libbolorgir.so'

      - uses: actions/upload-artifact@v4
        with:
          name: ci-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sdist-no-zig:
    # A user without Zig installs the sdist.
    name: sdist install without Zig
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-sdist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the sdist and run the release smoke test
        run: |
          if command -v zig; then echo "zig must not be on PATH"; exit 1; fi
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade "pip>=24"
          /tmp/v/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/v/bin/python "$GITHUB_WORKSPACE/tests/release/smoke_release.py"

  hf-integration:
    # The HF integration must actually run (not skip), on both ends of the
    # supported range: a dedicated job with CPU torch and an expected-skips
    # check.
    name: HF integration (CPU torch, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The full suites below include tests/test_release_manifest.py,
          # which needs BASELINE_REV (2523dd9) in the history (as the
          # python job; the default depth 1 checkout does not contain it).
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build core library (ReleaseSafe, portable CPU)
        run: zig build -Drelease=true -Dcpu=baseline

      - name: Build core with test hooks (probe and fail_row tests)
        # The probe and fail_row tests need -Dtest_hooks=true; zig-out/lib
        # stays the hook-free release library (checked in the num-cert job).
        run: zig build -Drelease=true -Dcpu=baseline -Dtest_hooks=true --prefix zig-out/test-hooks

      - name: Install CPU torch and pinned test deps
        # regress: 2025.10.1 builds through PyO3 0.26, which rejects Python
        # 3.15; 2026.9.1 is the first release with a cp315 wheel.
        run: |
          python3 -m pip install --upgrade pip "setuptools>=77" wheel
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install pytest numpy jsonschema "regress==${{ matrix.python-version == '3.15' && '2026.9.1' || '2025.10.1' }}" "transformers==5.17.0" "tokenizers==0.23.2"

      - name: Build Python extension in place
        working-directory: python
        env:
          BLG_SKIP_ZIG: "1"
        run: python3 setup.py build_ext --inplace

      - name: Probe and fail_row hook tests (must run, not skip)
        env:
          BLG_TEST_HOOKS_LIB: ${{ github.workspace }}/zig-out/test-hooks/lib/libbolorgir.so.0.1.0
        run: |
          PYTHONPATH=python python3 -m pytest -q --junit-xml=/tmp/hooks.xml \
            tests/test_probe.py::test_probe_found_and_inconclusive_with_hooks \
            python/tests/test_hf_adapters.py::test_fail_row_with_unknown_forced_by_the_test_hook
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET

          suite = ET.parse("/tmp/hooks.xml").getroot().find("testsuite")
          print(dict(suite.attrib))
          assert int(suite.get("tests", 0)) >= 2
          assert suite.get("skipped", "0") == "0", "hook tests must not skip"
          assert suite.get("failures", "0") == "0"
          assert suite.get("errors", "0") == "0"
          EOF

      - name: HF adapter tests (no unexpected skips)
        env:
          BLG_TEST_HOOKS_LIB: ${{ github.workspace }}/zig-out/test-hooks/lib/libbolorgir.so.0.1.0
        run: |
          PYTHONPATH=python python3 -m pytest python/tests/test_hf_adapters.py -q --junit-xml=/tmp/hf.xml
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/hf.xml").getroot()
          suite = root.find("testsuite")
          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          print(f"tests={tests} skipped={skipped} failures={failures} errors={errors}")
          assert failures == 0 and errors == 0
          assert skipped == 0, "HF integration must not skip"
          assert tests >= 30, tests
          EOF

      - name: Full Python suites on CPU torch
        env:
          BLG_TEST_HOOKS_LIB: ${{ github.workspace }}/zig-out/test-hooks/lib/libbolorgir.so.0.1.0
        run: |
          PYTHONPATH=python BLG_TEST_BACKEND=ctypes python3 -m pytest tests/ python/tests/ -q
          PYTHONPATH=python BLG_TEST_BACKEND=package python3 -m pytest tests/ python/tests/ -q

  fuzz:
    # The weekly run adds what the regular jobs do not: a full seeded Zig
    # fuzz campaign with the report kept as an artifact.
    name: Zig fuzz (seeded)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Fuzz campaign (seed 424242)
        run: zig build fuzz -Drelease=true -- --seed 424242

      - name: Upload fuzz report
        uses: actions/upload-artifact@v4
        with:
          name: zig-fuzz-report
          path: tests/fuzz/artifacts/zig_fuzz_report.json
          if-no-files-found: error
