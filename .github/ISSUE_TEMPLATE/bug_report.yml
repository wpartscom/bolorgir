name: Bug report
description: Report a reproducible problem in Bolorgir
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please provide a minimal reproduction - it is
        usually the schema (or literal set), the profile, the tokenizer
        description and a short script.
  - type: input
    id: version
    attributes:
      label: Bolorgir version and installation
      description: bolorgir.__version__ and how it was installed (release wheel or sdist, or a commit)
      placeholder: "0.2.0rc1, wheel from the GitHub release / commit abc1234"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and Zig versions
      placeholder: "Python 3.14.8, Zig 0.17.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS / platform
      description: OS and version, CPU architecture, glibc version
      placeholder: "Ubuntu 22.04 x86_64, glibc 2.35"
    validations:
      required: true
  - type: input
    id: tokenizer
    attributes:
      label: Tokenizer
      description: Name/revision, or how the TokenizerBundle was built
      placeholder: "openai-community/gpt2, TokenizerBundle.from_hf"
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Schema or literal set
      render: json
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - canonical-v1 (default)
        - spec-v1
        - literal set (no profile)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short script that shows the problem, with the engine mode and limits
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
      description: The exception or status with its message, the generated text, or how long a call ran before you stopped it
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Mode and limits
      description: Mode (lazy/adaptive/precompute), cache/memory limits, batch size
      placeholder: "mode=adaptive, memory_limit_mb=256, cache default"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: The reproduction is minimal (schema + tokenizer + steps)
          required: true
